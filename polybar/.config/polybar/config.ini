include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=12;3
font-2 = Symbols Nerd Font Mono:size=11;3
font-3 = Noto Color Emoji:scale=10;2
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.dim}
modules-left = i3 active-window w_icons tray
modules-center = 
modules-right = backlight pulseaudio network battery bluetooth cpu gpu memory filesystem notifications date
wm-restack = i3
enable-ipc = true
cursor-click = pointer

[module/i3]
; custom list instead of internal/i3 so the private space never shows up
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.py
tail = true
format = <label>
label = %output%

[module/active-window]
type = internal/xwindow
format = <label>
label = %instance%
label-maxlen = 35
label-empty =

[module/w_icons]
type = custom/script
exec = ~/.config/polybar/scripts/windows_icons.sh
tail = true
format = <label>
label = %output%

[module/tray]
type = internal/tray
tray-spacing = 6px

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = alacritty -e nmtui

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = blueman-manager

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = C %percentage%%

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 3
format = <label>
label = G %output%

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/ram.sh
interval = 3
format = <label>
label = M %output%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
format-mounted = <label-mounted>
label-mounted =  %free%

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notif.sh
interval = 1
click-left = sh -c 'if command -v dunstctl >/dev/null 2>&1; then dunstctl set-paused toggle; elif command -v swaync-client >/dev/null 2>&1; then swaync-client -t -sw; fi'

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/datetime.sh
interval = 5

; --- Optional / Dormant modules (available for future reference) ---

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.accent}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
label-muted = 󰝟
label-muted-foreground = ${colors.dim}
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = ${env:BAT:BAT0}
adapter = ${env:ADP:AC}
full-at = 99
poll-interval = 5
format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = 󰂄 %percentage%%
label-discharging = %percentage%%
label-full = 󰁹
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰂂
ramp-capacity-6 = 󰁹

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT:amdgpu_bl1}
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
label = %output%
click-left = playerctl previous
click-middle = playerctl play-pause
click-right = playerctl next
